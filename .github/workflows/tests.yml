# Runs the test suite on every push and pull request.
# The slow training test runs only when started by hand (Actions -> Tests -> Run workflow).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      include_slow:
        description: "Also run the slow full-training test"
        type: boolean
        default: false

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # CPU-only torch: the default wheel bundles CUDA and is several GB.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: |
          if [ "${{ inputs.include_slow }}" = "true" ]; then
            python -m pytest -q
          else
            python -m pytest -q -m "not slow"
          fi
